name: gestion_inventario_domestico
description: "Inventario doméstico / alacena con caducidad FEFO, calendario y alarmas locales."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  table_calendar: ^3.1.0
  badges: ^3.1.0
  image_picker: ^1.0.0
  path_provider: ^2.1.0
  intl: 0.20.3
  sqflite: ^2.3.0
  path: ^1.9.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
